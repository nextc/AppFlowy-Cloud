name: build-oss-cloud-image

on:
  workflow_dispatch: {}   # lets you run it manually from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write          # allows pushing to GHCR with the built-in token

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 for Railway)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nextc/appflowy-cloud:latest
            ghcr.io/nextc/appflowy-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
