name: build-oss-cloud-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build the OSS images from"
        required: true
        default: "0.9.64"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: appflowy-cloud
            dockerfile: ./Dockerfile
          - image: appflowy-worker
            dockerfile: ./services/appflowy-worker/Dockerfile
          - image: admin-frontend
            dockerfile: ./admin_frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nextc/${{ matrix.image }}:${{ inputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
