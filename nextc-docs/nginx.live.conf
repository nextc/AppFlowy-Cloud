events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/wasm;
    resolver __RESOLVER__ valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen 8080;
        client_max_body_size 10M;
        underscores_in_headers on;

        location /gotrue/ {
            set $gotrue_upstream __GOTRUE_HOST__:9999;
            proxy_pass http://$gotrue_upstream;
            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }

        location /ws {
            set $cloud_upstream __CLOUD_HOST__:8000;
            proxy_pass http://$cloud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location /api {
            set $cloud_upstream __CLOUD_HOST__:8000;
            proxy_pass http://$cloud_upstream;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;

            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                set $cloud_upstream2 __CLOUD_HOST__:8000;
                proxy_pass http://$cloud_upstream2;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }

            location /api/chat {
                set $cloud_upstream3 __CLOUD_HOST__:8000;
                proxy_pass http://$cloud_upstream3;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                set $cloud_upstream4 __CLOUD_HOST__:8000;
                proxy_pass http://$cloud_upstream4;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }

        location /minio-api/ {
            set $minio_upstream __MINIO_HOST__:9000;
            proxy_pass http://$minio_upstream;
            proxy_set_header Host __MINIO_HOST__:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/minio-api/(.*) /$1 break;
            proxy_connect_timeout 300s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            client_max_body_size 0;
        }

        location /ai/ {
            set $cloud_upstream5 __CLOUD_HOST__:8000;
            proxy_pass http://$cloud_upstream5;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
        }

        location /console {
            set $admin_upstream admin-frontend.railway.internal:3000;
            proxy_pass http://$admin_upstream;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }

        location = /minio {
            return 301 /minio/;
        }

        location /minio/ {
            set $minio_console minio.railway.internal:9001;
            proxy_pass http://$minio_console;
            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-NginX-Proxy true;
            real_ip_header X-Real-IP;
            proxy_connect_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            chunked_transfer_encoding off;
        }

        # OSS cloud has no billing API; report a non-Free/Pro plan so the web's
        # client-side member-limit check (Free=2, Pro=10) is bypassed. Server enforces no cap.
        location = /billing/api/v1/subscriptions {
            default_type application/json;
            return 200 '{"code":0,"message":"","data":[{"plan":"team"},{"plan":"ai_max"}]}';
        }

        # active-subscription: report the workspace as on the 'team' plan (list of plans)
        location ^~ /billing/api/v1/active-subscription/ {
            default_type application/json;
            return 200 '{"code":0,"message":"","data":["team","ai_max"]}';
        }

        location / {
            set $web_upstream __WEB_HOST__:80;
            proxy_pass http://$web_upstream;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
            # cosmetic: hide the always-shown commercial upgrade CTAs (server has no cap)
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter "</head>" "<script>(function(){function h(){var b=document.getElementsByTagName('button');for(var i=0;i<b.length;i++){var x=(b[i].textContent||'').trim();if(x==='Upgrade to Pro Plan'||x==='Get AI Max')b[i].style.display='none';}}var t=null;function s(){if(t)return;t=setTimeout(function(){t=null;h();},250);}function init(){h();new MutationObserver(s).observe(document.body,{childList:true,subtree:true});}if(document.body)init();else document.addEventListener('DOMContentLoaded',init);})();</script><script>(function(){var K='af_ws_retry';function chk(t){try{var j=JSON.parse(t);var n=parseInt(sessionStorage.getItem(K)||'0',10);if(j&&Array.isArray(j.data)&&j.data.length===0){if(n<2){sessionStorage.setItem(K,String(n+1));setTimeout(function(){location.reload();},6000+n*3000);}}else{sessionStorage.setItem(K,'99');}}catch(e){}}function m(u){try{return new URL(u,location.origin).pathname==='/api/workspace';}catch(e){return false;}}var of=window.fetch;if(of){window.fetch=function(){var a=arguments,u;try{u=(typeof a[0]==='string')?a[0]:(a[0]&&a[0].url);}catch(e){}var p=of.apply(this,a);try{if(u&&m(u)){p.then(function(r){r.clone().text().then(chk).catch(function(){});}).catch(function(){});}}catch(e){}return p;};}var OX=XMLHttpRequest.prototype.open,OS=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(mth,u){this.__afu=u;return OX.apply(this,arguments);};XMLHttpRequest.prototype.send=function(){var s=this;try{if(m(s.__afu)){s.addEventListener('load',function(){chk(s.responseText);});}}catch(e){}return OS.apply(this,arguments);};})();</script><script>(function(){var L={'Delete':1,'Move to Trash':1,'Move to trash':1,'Delete permanently':1,'Delete view':1};var canDelete=true;var lastWs=null;function gt(){var t=localStorage.getItem('token');if(!t)return null;try{var j=JSON.parse(t);return j.access_token||j.accessToken||t;}catch(e){return t;}}function wid(){var p=location.pathname.split('/');return p[1]==='app'?p[2]:null;}function sweep(){if(canDelete)return;var ns=document.querySelectorAll('div[class*=cursor-pointer]');for(var i=0;i<ns.length;i++){var el=ns[i];if(el.querySelector('div[class*=cursor-pointer]'))continue;var t=(el.textContent||'').trim();if(L[t]===1)el.style.display='none';}}var ob=false;function ensureObserver(){if(ob)return;ob=true;var to=null;new MutationObserver(function(){if(to)return;to=setTimeout(function(){to=null;sweep();},50);}).observe(document.documentElement,{childList:true,subtree:true});}function evaluate(id){var tok=gt();if(!tok||!id)return;fetch('/api/workspace',{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json();}).then(function(j){var ws=(j&&j.data)||[];var cur=null;for(var i=0;i<ws.length;i++){if(ws[i].workspace_id===id){cur=ws[i];break;}}if(!cur)return;canDelete=(cur.role==='Owner');lastWs=id;if(!canDelete){ensureObserver();sweep();}}).catch(function(){});}function tick(){var id=wid();if(id&&id!==lastWs){canDelete=true;evaluate(id);}}setInterval(tick,800);tick();})();</script></head>";
        }
    }
}
